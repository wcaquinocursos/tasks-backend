name: Java app build
run-name: ${{ github.actor }} is runnig build
on:
  pull_request:
    branches:
      - master
jobs:
  CI-Steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate
        run: mvn clean validate

      - name: Build app
        run: mvn -DskipTests=true clean package

      - name: Test app
        run: echo "Add test stage"