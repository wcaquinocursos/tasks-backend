name: Java app deploy
run-name: ${{ github.actor }} is runnig deploy
on:
  push:
    branches:
      - master
jobs:
  CD-Steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build app
        run: mvn -DskipTests=true clean package
      
      - name: Build app on container
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg="JARFILE=tasks-backend.jar" -t tasks-backend:$IMAGE_TAG
          docker image save tasks-backend:$IMAGE_TAG